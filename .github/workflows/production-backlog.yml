name: Production backlog integrity
on:
  push:
    branches: [main, 'task/KM-089-*']
  pull_request:
  workflow_dispatch:
jobs:
  validate-backlog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production backlog
        run: node tools/validate-production-backlog.mjs
