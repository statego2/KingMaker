name: KINGMAKER runtime and regression tests
on:
  push:
    branches: [main, 'task/KM-089-*']
  pull_request:
jobs:
  game-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, import graph and entrypoint checks
        run: npm run check
      - name: Node smoke, decision and save regression tests
        run: npm test
      - name: Production dependency graph and statuses
        run: npm run validate:backlog
      - name: Validate canonical knowledge taxonomy
        run: npm run validate:taxonomy
      - name: Validate original question intake
        run: npm run validate:mappings
      - name: Verify machine-readable coverage report
        run: |
          npm run report:coverage > /tmp/kingmaker-coverage.json
          node -e "const r=require('/tmp/kingmaker-coverage.json');if(!r.valid||r.expected_questions!==1000||r.imported_questions!==0||r.competencies_with_reviewed_primary!==0)process.exit(1);console.log('Coverage 0 of 1000 original records; 0 reviewed competencies')"
