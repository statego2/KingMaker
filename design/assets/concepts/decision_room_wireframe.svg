<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-label="KINGMAKER decision room wireframe concept">
<rect width="390" height="844" fill="#0B0E13"/>
<text x="24" y="42" fill="#98A2AF" font-family="Arial" font-size="11" letter-spacing="2">DECISION ROOM · 18:40</text>
<text x="24" y="78" fill="#E7E1D6" font-family="Georgia" font-size="25">THE 121ST VOTE</text>
<line x1="24" y1="96" x2="366" y2="96" stroke="#B4935B" stroke-width="1"/>
<text x="24" y="124" fill="#B4935B" font-family="Arial" font-size="10" letter-spacing="1">OBJECTIVE</text>
<text x="24" y="146" fill="#E7E1D6" font-family="Arial" font-size="13">Secure a viable government without</text>
<text x="24" y="164" fill="#E7E1D6" font-family="Arial" font-size="13">creating an implementation veto.</text>
