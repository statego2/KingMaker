<g fill="#98A2AF" font-family="Arial" font-size="8" text-anchor="middle"><text x="58" y="414">VARIN</text><text x="126" y="414">MARIN</text><text x="194" y="414">KESSAR</text><text x="262" y="414">ARVEN</text></g>
<text x="24" y="454" fill="#98A2AF" font-family="Arial" font-size="10" letter-spacing="1">OPTIONS</text>
<g font-family="Arial">
<rect x="24" y="470" width="342" height="74" rx="10" fill="#141A22" stroke="#202833"/>
<text x="40" y="494" fill="#B4935B" font-size="11">VERIFY</text><text x="40" y="518" fill="#E7E1D6" font-size="12">Buy one hour and confirm attendance.</text>
