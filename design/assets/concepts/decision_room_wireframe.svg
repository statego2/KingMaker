<text x="40" y="666" fill="#B4935B" font-size="11">COMMIT</text><text x="40" y="690" fill="#E7E1D6" font-size="12">Call the vote on current information.</text>
</g>
<rect x="24" y="760" width="160" height="48" rx="12" fill="#141A22" stroke="#5F678F"/><text x="104" y="790" fill="#E7E1D6" font-family="Arial" font-size="12" text-anchor="middle">INSPECT</text>
