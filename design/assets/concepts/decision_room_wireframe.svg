<circle cx="43" cy="245" r="3" fill="#4F8D89"/><text x="54" y="249" fill="#E7E1D6" font-family="Arial" font-size="12">120 reliable votes</text>
<circle cx="43" cy="270" r="3" fill="#4F8D89"/><text x="54" y="274" fill="#E7E1D6" font-family="Arial" font-size="12">Financing clock continues</text>
<text x="228" y="220" fill="#98A2AF" font-family="Arial" font-size="10">UNCERTAIN</text>
<circle cx="231" cy="245" r="3" fill="#C8953D"/><text x="242" y="249" fill="#E7E1D6" font-family="Arial" font-size="12">Arven abstention</text>
