<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="description" content="KINGMAKER — strategic narrative RPG vertical slice" />
  <title>KINGMAKER — Vertical Slice</title>
  <style>

:root {
  --bg: #070a10;
  --panel: #0d121c;
  --panel-2: #111827;
  --panel-3: #151d2b;
  --text: #eef2f7;
  --muted: #8e9bad;
  --faint: #566274;
  --line: rgba(255,255,255,.08);
  --line-strong: rgba(255,255,255,.14);
  --gold: #d5b15d;
  --gold-2: #f0d38a;
  --blue: #80a7d6;
  --good: #88b89d;
  --warn: #d6ad68;
  --danger: #d58b8b;
  --shadow: 0 18px 60px rgba(0,0,0,.38);
  --radius: 18px;
  --radius-sm: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body {
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 50% -20%, rgba(74,96,132,.22), transparent 34rem),
    linear-gradient(180deg, #0a0e16 0%, #070a10 52%, #05070b 100%);
}
button, input { font: inherit; }

.app-shell {
  width: min(100%, 520px);
  min-height: 100dvh;
  margin: 0 auto;
  border-left: 1px solid rgba(255,255,255,.04);
  border-right: 1px solid rgba(255,255,255,.04);
  position: relative;
  padding-bottom: calc(86px + var(--safe-bottom));
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: calc(12px + var(--safe-top)) 16px 10px;
  background: linear-gradient(180deg, rgba(7,10,16,.97), rgba(7,10,16,.84) 75%, rgba(7,10,16,0));
  backdrop-filter: blur(18px);
}

.brand-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand {
  letter-spacing: .18em;
  font-size: 13px;
  font-weight: 800;
  color: var(--gold-2);
}
.day {
  font-size: 12px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 10px;
  background: rgba(255,255,255,.025);
}
.progress {
  margin-top: 10px;
  height: 3px;
  border-radius: 10px;
  overflow: hidden;
  background: rgba(255,255,255,.07);
}
.progress > span {
  display:block;
  height:100%;
  background: linear-gradient(90deg, #806a37, var(--gold-2));
  transition: width .35s ease;
}

main { padding: 8px 14px 24px; }
.screen-title {
  margin: 8px 2px 15px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .18em;
  color: var(--muted);
}

.hero-card, .card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012)),
    var(--panel);
  box-shadow: var(--shadow);
}
.hero-card { padding: 20px; overflow:hidden; position:relative; }
.hero-card::after {
  content:"";
  position:absolute;
  width:180px; height:180px;
  border-radius:50%;
  right:-90px; top:-95px;
  background: radial-gradient(circle, rgba(213,177,93,.14), transparent 68%);
  pointer-events:none;
}
.kicker {
  color: var(--gold-2);
  text-transform: uppercase;
  letter-spacing: .16em;
  font-size: 10px;
  font-weight: 800;
}
.hero-card h1 {
  margin: 8px 0 10px;
  font-size: 27px;
  line-height: 1.08;
  letter-spacing: -.025em;
}
.lede {
  margin: 0;
  color: #c5cfdb;
  line-height: 1.55;
  font-size: 15px;
}
.scene-body {
  margin-top: 18px;
  display: grid;
  gap: 11px;
  color: #d8e0e9;
  font-size: 15px;
  line-height: 1.62;
}
.scene-body p { margin: 0; }

.meta-row {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin: 14px 0 0;
}
.pill {
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 9px;
  font-size:11px;
  color:var(--muted);
  background:rgba(255,255,255,.022);
}
.pill.gold { color:var(--gold-2); border-color:rgba(213,177,93,.22); }

.evidence-grid { display:grid; gap:9px; margin-top:16px; }
.evidence {
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:rgba(255,255,255,.022);
  padding:12px 13px;
}
.evidence-head {
  display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
  font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.09em;
}
.evidence strong {
  display:block;
  margin-top:7px;
  font-size:14px;
  line-height:1.45;
  color:#e3e9f0;
}
.source-dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--gold);
  box-shadow: 0 0 0 4px rgba(213,177,93,.08);
  flex:0 0 auto;
  margin-top:3px;
}

.decision-block {
  margin-top: 16px;
  border-top: 1px solid var(--line);
  padding-top: 15px;
}
.question {
  margin:0 0 12px;
  color:#f1f4f8;
  font-size:15px;
  font-weight:700;
  line-height:1.45;
}
.option-list { display:grid; gap:9px; }
.option {
  width:100%;
  text-align:left;
  color:#e6ebf2;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.014));
  padding:13px 14px;
  cursor:pointer;
  transition: transform .14s ease, border-color .14s ease, background .14s ease;
}
.option:active { transform: scale(.99); }
.option:hover { border-color:rgba(213,177,93,.28); background:rgba(213,177,93,.05); }
.option-title { font-size:14px; line-height:1.4; font-weight:700; }
.option-sub { color:var(--muted); font-size:12px; line-height:1.35; margin-top:4px; }

.result {
  margin-top:14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(128,167,214,.05);
  padding:14px;
}
.result h3 { margin:0 0 7px; font-size:13px; color:#d9e5f3; }
.result p { margin:0; color:#b8c5d4; font-size:13px; line-height:1.5; }
.result-actions { display:flex; gap:8px; margin-top:12px; }
.primary, .secondary {
  border-radius:11px;
  padding:10px 12px;
  cursor:pointer;
  border:1px solid var(--line);
  font-weight:750;
}
.primary { background:var(--gold); color:#151109; border-color:transparent; }
.secondary { background:transparent; color:#d7dfe9; }
.analysis-box {
  margin-top:10px;
  padding:11px 12px;
  border-left:2px solid var(--gold);
  background:rgba(213,177,93,.045);
  color:#bfc9d5;
  font-size:12px;
  line-height:1.52;
}

.section { margin-top:14px; }
.section h2 { font-size:13px; margin:0 0 10px; color:#dfe6ef; }
.card { padding:14px; box-shadow:none; }
.list { display:grid; gap:9px; }
.row {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.018);
}
.row-main { min-width:0; }
.row-title { font-size:14px; font-weight:750; }
.row-sub { font-size:12px; color:var(--muted); margin-top:3px; line-height:1.35; }
.badge {
  flex:0 0 auto;
  font-size:10px; text-transform:uppercase; letter-spacing:.08em;
  border:1px solid var(--line); border-radius:999px; padding:6px 8px; color:var(--muted);
}
.badge.unread { color:var(--gold-2); border-color:rgba(213,177,93,.3); }

.person {
  display:grid;
  grid-template-columns: 42px 1fr auto;
  gap:11px;
  align-items:center;
}
.avatar {
  width:42px; height:42px; border-radius:13px;
  display:grid; place-items:center;
  border:1px solid var(--line);
  background:linear-gradient(135deg, rgba(128,167,214,.12), rgba(213,177,93,.08));
  color:#dfe7f1; font-size:13px; font-weight:800;
}
.relation { font-size:11px; color:var(--blue); }

.track { margin-top:12px; }
.track:first-child { margin-top:0; }
.track-head { display:flex; justify-content:space-between; gap:10px; font-size:12px; }
.track-head span:first-child { color:#d9e0e9; }
.track-head span:last-child { color:var(--muted); }
.track-bar { height:5px; background:rgba(255,255,255,.055); border-radius:10px; margin-top:7px; overflow:hidden; }
.track-bar > span { display:block; height:100%; background:linear-gradient(90deg, #53677f, #91a7c0); }

.clock {
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.018);
}
.clock-top { display:flex; justify-content:space-between; gap:12px; }
.clock-title { font-size:13px; font-weight:750; }
.clock-value { color:var(--gold-2); font-size:12px; }
.clock-sub { margin-top:5px; color:var(--muted); font-size:12px; }

.bottom-nav {
  position:fixed;
  z-index:40;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(100%, 520px);
  padding:8px 10px calc(8px + var(--safe-bottom));
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  background:rgba(8,11,17,.94);
  border-top:1px solid var(--line);
  backdrop-filter:blur(22px);
}
.nav-btn {
  min-height:52px;
  border:0;
  border-radius:13px;
  color:#707d8d;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  cursor:pointer;
}
.nav-btn.active { color:var(--gold-2); background:rgba(213,177,93,.055); }
.nav-icon { font-size:17px; line-height:1; }

.notice {
  margin-bottom:11px;
  padding:10px 12px;
  border:1px solid rgba(213,177,93,.19);
  background:rgba(213,177,93,.055);
  border-radius:12px;
  color:#d5c69f;
  font-size:12px;
  line-height:1.45;
}
.muted { color:var(--muted); }

.summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.stat-card { border:1px solid var(--line); border-radius:14px; padding:13px; background:rgba(255,255,255,.018); }
.stat-value { font-size:21px; font-weight:850; color:#e9edf2; }
.stat-label { margin-top:4px; font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); }

hr.soft { border:0; border-top:1px solid var(--line); margin:16px 0; }

@media (min-width: 700px) {
  body { padding: 24px 0; }
  .app-shell {
    min-height: calc(100dvh - 48px);
    border:1px solid rgba(255,255,255,.07);
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.45);
  }
  .bottom-nav { bottom:24px; border:1px solid var(--line); border-radius:0 0 26px 26px; }
}

</style>
</head>
